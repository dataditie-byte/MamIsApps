<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6f63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Jadwal Pengajar — Sanggar Belajar Mam Is</title>

<style>
  :root{
    --green:#0b6f63;
    --green-dark:#07564e;
    --green-light:#e8f5f1;
    --bg:#f3f8f6;
    --white:#fff;
    --text:#173b36;
  }

  *{box-sizing:border-box}

  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
  }

  body{
    display:flex;
    flex-direction:column;
  }

  /* =====================================================
     HEADER KHUSUS GITHUB
     Header ini berada DI LUAR Apps Script.
     ===================================================== */
  .brandbar{
    position:relative;
    z-index:100;
    flex:0 0 auto;
    height:68px;
    display:flex;
    align-items:center;
    padding:8px 18px;
    color:#fff;
    background:linear-gradient(135deg,var(--green-dark),var(--green));
    box-shadow:0 3px 12px rgba(0,0,0,.18);
  }

  .brand{
    display:flex;
    align-items:center;
    gap:11px;
    min-width:0;
  }

  /* Logo Sanggar Mam Is — dibuat inline sehingga tidak
     bergantung pada file gambar eksternal. */
  .logo{
    width:45px;
    height:45px;
    flex:0 0 45px;
    border-radius:13px;
    background:#fff;
    display:grid;
    place-items:center;
    box-shadow:0 2px 7px rgba(0,0,0,.18);
    overflow:hidden;
  }

  .logo img{
    width:100%;
    height:100%;
    padding:4px;
    object-fit:contain;
    display:block;
  }

  .fallback-mark{
    display:none;
    color:var(--green);
    font-weight:900;
    font-size:23px;
  }

  .logo.logo-fallback .fallback-mark{
    display:block;
  }

  .brand-text{
    min-width:0;
  }

  .brand-name{
    font-size:17px;
    line-height:1.15;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .brand-sub{
    margin-top:3px;
    font-size:11px;
    opacity:.88;
    white-space:nowrap;
  }

  .reload{
    margin-left:auto;
    flex:0 0 auto;
    border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.13);
    color:#fff;
    border-radius:10px;
    padding:9px 12px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    touch-action:manipulation;
  }

  .reload:active{transform:scale(.97)}

  /* =====================================================
     FRAME
     ===================================================== */
  /* =====================================================
     KUNCI AKSES
     ===================================================== */
  .access-overlay{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:linear-gradient(135deg,#07564e,#0b6f63);
  }

  .access-overlay.hide{
    display:none;
  }

  .access-card{
    width:min(390px,100%);
    background:#fff;
    border-radius:22px;
    padding:28px 24px 24px;
    box-shadow:0 18px 55px rgba(0,0,0,.25);
    text-align:center;
  }

  .access-logo{
    width:72px;
    height:72px;
    margin:0 auto 14px;
    border-radius:18px;
    overflow:hidden;
    background:#fff;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
  }

  .access-logo img{
    width:100%;
    height:100%;
    object-fit:contain;
    padding:5px;
  }

  .access-card h1{
    margin:0;
    color:var(--text);
    font-size:21px;
  }

  .access-card p{
    margin:7px 0 20px;
    color:#6b7d79;
    font-size:13px;
    line-height:1.5;
  }

  .access-input{
    width:100%;
    height:48px;
    padding:0 15px;
    border:1px solid #cbded9;
    border-radius:12px;
    outline:none;
    font-size:16px;
    text-align:center;
    color:var(--text);
  }

  .access-input:focus{
    border-color:var(--green);
    box-shadow:0 0 0 3px rgba(11,111,99,.10);
  }

  .access-btn{
    width:100%;
    height:48px;
    margin-top:11px;
    border:0;
    border-radius:12px;
    background:var(--green);
    color:#fff;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    touch-action:manipulation;
  }

  .access-btn:active{transform:scale(.98)}

  .access-error{
    min-height:19px;
    margin-top:10px;
    color:#c0392b;
    font-size:12px;
    font-weight:700;
  }

  .access-note{
    margin-top:15px;
    color:#8a9b97;
    font-size:10px;
  }

  .frame-shell{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    width:100%;
    overflow:hidden;
    background:var(--bg);
  }

  /*
   * Apps Script menampilkan banner:
   * "This application was created by a Google Apps Script user"
   *
   * Kita tidak mengubah Apps Script.
   * Iframe digeser ke atas sehingga banner tersebut
   * berada di luar area terlihat.
   *
   * Jika suatu saat tinggi banner Google berubah,
   * cukup ubah GAS_TOP_CROP.
   */
  #gasFrame{
    position:absolute;
    left:0;
    top:-48px;
    width:100%;
    height:calc(100% + 48px);
    border:0;
    display:block;
    background:var(--bg);
    touch-action:manipulation;
  }

  .loading{
    position:absolute;
    inset:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    color:var(--text);
    transition:opacity .2s ease;
  }

  .loading.hide{
    opacity:0;
    pointer-events:none;
  }

  .loading-box{
    text-align:center;
    padding:25px;
  }

  .spinner{
    width:31px;
    height:31px;
    margin:0 auto 12px;
    border:3px solid #cfe4df;
    border-top-color:var(--green);
    border-radius:50%;
    animation:spin .8s linear infinite;
  }

  @keyframes spin{
    to{transform:rotate(360deg)}
  }

  .error{
    max-width:500px;
    padding:22px;
    margin:20px;
    background:#fff;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    text-align:center;
  }

  .error b{display:block;margin-bottom:7px}
  .error small{color:#687b77;line-height:1.5}

  @media(max-width:600px){
    .brandbar{
      height:62px;
      padding:7px 10px;
    }

    .logo{
      width:42px;
      height:42px;
      flex-basis:42px;
      border-radius:12px;
    }

    .brand-name{font-size:15px}
    .brand-sub{font-size:10px}

    .reload{
      padding:8px 9px;
      font-size:11px;
    }
  }
</style>
</head>

<body>

<!-- KUNCI AKSES PENGAJAR -->
<div id="accessOverlay" class="access-overlay">
  <div class="access-card">
    <div class="access-logo">
      <img src="./logo-mam-is.png" alt="Logo Sanggar Mam Is">
    </div>
    <h1>Jadwal Pengajar</h1>
    <p>Masukkan kode akses untuk membuka jadwal pengajar Sanggar Belajar Mam Is.</p>
    <form id="accessForm" autocomplete="off">
      <input
        id="accessCode"
        class="access-input"
        type="password"
        inputmode="text"
        autocomplete="off"
        autocapitalize="none"
        spellcheck="false"
        placeholder="Kode akses"
        aria-label="Kode akses"
        required>
      <button class="access-btn" type="submit">Masuk</button>
      <div id="accessError" class="access-error" aria-live="polite"></div>
    </form>
    <div class="access-note">Khusus pengajar Sanggar Belajar Mam Is</div>
  </div>
</div>

<!-- HEADER KHUSUS PENGAJAR -->
<header class="brandbar">
  <div class="brand">

    <!-- Logo Sanggar Mam Is dari repository GitHub -->
    <div class="logo" aria-label="Logo Sanggar Mam Is">
      <img
        src="./logo-mam-is.png"
        alt="Logo Sanggar Mam Is"
        onerror="this.style.display='none';this.parentElement.classList.add('logo-fallback')">
      <span class="fallback-mark">M</span>
    </div>

    <div class="brand-text">
      <div class="brand-name">Sanggar Belajar Mam Is</div>
      <div class="brand-sub">Jadwal Pengajar</div>
    </div>
  </div>

  <button class="reload" type="button" onclick="reloadJadwal()">
    ↻ Muat Ulang
  </button>
</header>

<!-- Apps Script tetap menjadi mesin jadwal -->
<div class="frame-shell">

  <div id="loading" class="loading">
    <div class="loading-box">
      <div class="spinner"></div>
      <div>Membuka Jadwal Pengajar...</div>
    </div>
  </div>

  <iframe
    id="gasFrame"
    title="Jadwal Pengajar Sanggar Belajar Mam Is"
    allow="fullscreen"
    loading="eager">
  </iframe>

</div>

<script>
/* ==========================================================
   KONFIGURASI
   ==========================================================

   GANTI SATU BARIS INI dengan URL Web App Apps Script
   JADWAL PENGAJAR yang sekarang sudah berjalan.

   Contoh:
   const GAS_URL =
     'https://script.google.com/macros/s/XXXXXXXXXXXX/exec';

   JANGAN mengubah Code.gs atau jadwal.html untuk file GitHub ini.
   ========================================================== */

const ACCESS_CODE = 'mamis3';
const ACCESS_STORAGE_KEY = 'mamis_jadwal_pengajar_access';

const GAS_URL = 'https://script.google.com/macros/s/AKfycbxOXjcYWFL7-xGJygmh9t1I1uTL_xRbohVTFf8ns_BqrbVdgNMQKSc07wSJdW8ho3mejQ/execs';

const GAS_TOP_CROP = 48;

const frame = document.getElementById('gasFrame');
const loading = document.getElementById('loading');

function showError(message){
  loading.classList.remove('hide');
  loading.innerHTML = `
    <div class="error">
      <b>Jadwal Pengajar belum dapat dibuka</b>
      <small>${message}</small>
    </div>
  `;
}

function unlockJadwal(){
  const overlay = document.getElementById('accessOverlay');
  const input = document.getElementById('accessCode');
  const error = document.getElementById('accessError');

  overlay.classList.add('hide');
  error.textContent = '';
  try{
    sessionStorage.setItem(ACCESS_STORAGE_KEY, '1');
  }catch(e){}

  loadJadwal();
}

function initAccess(){
  const overlay = document.getElementById('accessOverlay');
  const form = document.getElementById('accessForm');
  const input = document.getElementById('accessCode');
  const error = document.getElementById('accessError');

  let alreadyUnlocked = false;
  try{
    alreadyUnlocked = sessionStorage.getItem(ACCESS_STORAGE_KEY) === '1';
  }catch(e){}

  if(alreadyUnlocked){
    overlay.classList.add('hide');
    loadJadwal();
    return;
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    const code = String(input.value || '').trim();

    if(code === ACCESS_CODE){
      unlockJadwal();
    }else{
      error.textContent = 'Kode akses salah. Silakan coba lagi.';
      input.value = '';
      input.focus();
    }
  });

  setTimeout(function(){ input.focus(); }, 100);
}

function loadJadwal(){
  if(
    !GAS_URL ||
    GAS_URL.indexOf('PASTE_URL_WEB_APP') !== -1
  ){
    showError(
      'Isi URL Web App Apps Script pada variabel GAS_URL di file jadwalpengajar.html.'
    );
    return;
  }

  loading.classList.remove('hide');

  frame.style.top = '-' + GAS_TOP_CROP + 'px';
  frame.style.height = 'calc(100% + ' + GAS_TOP_CROP + 'px)';

  frame.onload = function(){
    setTimeout(function(){
      loading.classList.add('hide');
    },350);
  };

  frame.src =
    GAS_URL +
    (GAS_URL.indexOf('?') >= 0 ? '&' : '?') +
    'github=jadwalpengajar&_=' + Date.now();
}

function reloadJadwal(){
  loading.classList.remove('hide');

  try{
    if(frame.contentWindow){
      frame.contentWindow.location.reload();
      setTimeout(function(){
        loading.classList.add('hide');
      },1000);
      return;
    }
  }catch(e){}

  loadJadwal();
}

window.addEventListener('load', initAccess);
</script>

</body>
</html>
