<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#173b63">
  <title>Offline | Sanggar Mam Is</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:20px;
      font-family:Arial,Helvetica,sans-serif;
      background:linear-gradient(135deg,#173b63,#2f80ed);
      color:#14213d;
    }
    .card{
      width:min(430px,100%);
      background:white;
      border-radius:26px;
      padding:30px;
      text-align:center;
      box-shadow:0 24px 70px rgba(0,0,0,.25);
    }
    img{
      width:82px;
      height:82px;
      object-fit:contain;
      margin:0 auto 16px;
      border-radius:18px;
    }
    h1{margin:0 0 10px;color:#173b63}
    p{color:#64748b;line-height:1.6}
    button,a{
      display:inline-flex;
      justify-content:center;
      align-items:center;
      border:0;
      border-radius:14px;
      padding:13px 18px;
      font-weight:800;
      text-decoration:none;
      cursor:pointer;
    }
    button{
      background:linear-gradient(135deg,#173b63,#2f80ed);
      color:white;
      width:100%;
      margin-top:12px;
    }
    a{
      color:#173b63;
      margin-top:10px;
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="logo-mam-is.png" alt="Logo Sanggar Mam Is" onerror="this.style.display='none'">
    <h1>Koneksi Internet Terputus</h1>
    <p>
      Halaman dasar aplikasi masih dapat dibuka, tetapi data siswa,
      materi, absensi, pembayaran, dan dashboard memerlukan koneksi internet.
    </p>
    <button onclick="location.reload()">Coba Sambungkan Kembali</button>
    <a href="index.html">Kembali ke Beranda</a>
  </main>
</body>
</html>
