<!-- 2. Tambahkan input pencarian siswa sebelum list siswa: -->
<input id="searchSiswa" placeholder="Ketik nama siswa..." onkeyup="renderAll()" />

<!-- 3. Ganti fungsi renderSiswaTable() dengan ini: -->
<script>
function renderSiswaTable(){
  const kw = (document.getElementById('searchSiswa')?.value || '').toLowerCase();

  const rows = db.siswa.filter(r =>
    String(r['Nama Siswa'] || '').toLowerCase().includes(kw) ||
    String(r['Jenjang'] || '').toLowerCase().includes(kw) ||
    String(r['No WA'] || '').toLowerCase().includes(kw)
  );

  let h='<table><tr><th>Siswa</th><th>WA</th><th>Aksi</th></tr>';

  rows.forEach(r=>{
    h+=`<tr>
      <td>${r['Nama Siswa']||''}<br><span class="small">${r['Jenjang']||''}</span></td>
      <td>${r['No WA']||''}</td>
      <td><button class="btn-red" onclick="hapusData('deleteSiswa','${r['ID Siswa']}')">Hapus</button></td>
    </tr>`;
  });

  return h+'</table>';
}
</script>

<!-- 7. Tambahkan blok Pelunasan di menu pembayaran: -->
<div class="card">
  <h3>Pelunasan Cicilan</h3>
  <select id="pilihCicilan"></select>
  <input type="date" id="tanggalPelunasan">
  <input type="number" id="jumlahPelunasan" placeholder="Nominal pelunasan">
  <select id="metodePelunasan">
    <option>Cash</option>
    <option>Transfer</option>
    <option>QRIS</option>
  </select>
  <textarea id="ketPelunasan" placeholder="Keterangan pelunasan"></textarea>
  <button class="btn-green" onclick="simpanPelunasan()">Simpan Pelunasan</button>
  <div class="msg" id="msgPelunasan"></div>
</div>

<script>
function isiCicilan(){
  const el = document.getElementById('pilihCicilan');
  if(!el) return;

  const rows = db.pembayaran.filter(r => Number(r['Sisa'] || 0) > 0);
  el.innerHTML = '<option value="">Pilih cicilan belum lunas</option>';

  rows.forEach(r=>{
    el.innerHTML += `<option value="${r['ID Pembayaran']}">
      ${r['Nama Siswa']} - ${r['Bulan Pembayaran']} - Sisa ${rupiah(r['Sisa'])}
    </option>`;
  });
}

// Panggil ini di akhir renderAll():
// isiCicilan();

async function simpanPelunasan(){
  const id = val('pilihCicilan');
  if(!id) return alert('Pilih cicilan dulu');

  const data = {
    idPembayaran: id,
    tanggalBayar: val('tanggalPelunasan'),
    dibayar: val('jumlahPelunasan'),
    metodeBayar: val('metodePelunasan'),
    keterangan: val('ketPelunasan')
  };

  const res = await api('addPelunasan', {data: JSON.stringify(data)});
  document.getElementById('msgPelunasan').innerText = res.message + ' - ' + res.statusPembayaran;
  loadData();
}
